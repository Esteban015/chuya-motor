<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Apple touch icon (7F.1): same mark as favicon.svg, full-bleed square (iOS applies its own
       rounded mask; transparent corners would show as black) and a little more padding. -->
  <rect width="64" height="64" fill="#103B3B"/>
  <g transform="translate(32 33) scale(0.82) translate(-32 -33)">
    <path d="M13.8 48.5 A21 21 0 1 1 50.2 48.5" fill="none" stroke="#D9F4A5" stroke-width="6" stroke-linecap="round"/>
    <line x1="32" y1="38" x2="24.6" y2="25.6" stroke="#F7F6F0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="23.6" cy="23.9" r="4.6" fill="#D9F4A5"/>
    <circle cx="32" cy="38" r="4.6" fill="#F7F6F0"/>
  </g>
</svg>
